name: Session Market Scanner

on:
  schedule:
    # GitHub starts the workflow every 5 minutes.
    # agent.py scans every minute inside each run.
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: session-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:

      # ===================================================
      # CHECKOUT
      # ===================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ===================================================
      # PYTHON
      # ===================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ===================================================
      # DEPENDENCIES
      # ===================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ===================================================
      # RUN SCANNER
      # ===================================================

      - name: Run Session Market Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

          # Run one scan every 60 seconds.
          # GitHub starts this workflow every 5 minutes,
          # so each workflow performs 5 scans.
          LOOP_SCANS: "5"
          SCAN_INTERVAL_SECONDS: "60"

          STATE_FILE: "state.json"

        run: |
          python agent.py

      # ===================================================
      # SAVE STATE
      # ===================================================

      - name: Save scanner state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update scanner state [skip ci]"
            git pull --rebase
            git push
          fi