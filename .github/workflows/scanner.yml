name: Session Market Scanner

on:
  schedule:
    # Heartbeat trigger. A running job scans every minute for ~50 minutes,
    # so temporary GitHub schedule delays do not stop market monitoring.
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: session-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A scheduled run may sit pending behind the active long-running job.
          # Always load the newest state/code when it actually starts.
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Session Market Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

          # Stay alive and scan every minute. New 5-minute schedule events act
          # as a heartbeat so a pending replacement is ready when this run ends.
          LOOP_SCANS: "50"
          SCAN_INTERVAL_SECONDS: "60"
          STATE_FILE: "state.json"

        run: |
          python resilient_runner.py

      - name: Save scanner state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update scanner state [skip ci]"
            git pull --rebase
            git push
          fi
